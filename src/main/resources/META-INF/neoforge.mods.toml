Unofficial community port of Dragon Maid Companion (NeoForge 1.21.1).
Original mod (c) 别思丶 / EvenFlowInShipGirl, All Rights Reserved. Free, non-commercial distribution only.
Port repository: https://github.com/bierangas26-cyber/dragonmaid-neoforge'''

[[dependencies.dragonmaid]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.264,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.dragonmaid]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.dragonmaid]]
    modId="iceandfire"
    type="required"
    versionRange="[2.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.dragonmaid]]
    modId="geckolib"
    type="required"
    versionRange="[4.7.4,5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.dragonmaid]]
    modId="jade"
    type="optional"
    versionRange="[15.10,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.dragonmaid]]
    modId="patchouli"
    type="required"
    versionRange="[1.21,)"
    ordering="AFTER"
    side="BOTH"

# Mixin configs must be declared here as well: the "MixinConfigs" jar-manifest attribute is only
# read from an actual jar, so a development run (classpath directory) would otherwise start with
# no dragonmaid mixins at all.
[[mixins]]
    config="dragonmaid.mixins.json"